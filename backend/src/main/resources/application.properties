spring.application.name=gem-forensic
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:mem:gem_forensic;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Custom Application Config
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
app.upload.dir=${UPLOAD_DIR:./uploads}
jwt.secret=${JWT_SECRET:default_jwt_secret_key_change_in_production}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

# Enable Web Mappings
spring.web.resources.add-mappings=true
